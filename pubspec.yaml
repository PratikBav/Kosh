name: kosh
description: "Kosh — Futuristic personal finance & financial goal tracking app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Storage
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4

  # Auth
  local_auth: ^2.3.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Charts
  fl_chart: ^0.70.2

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # Utilities
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7
  csv: ^8.0.0
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
